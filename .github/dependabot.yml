# One weekly PR for the workspace lock (uv: every member's pyproject.toml and the shared uv.lock), one for the
# workflows' actions, one for the development image (the uv binary and the Python base). Dev-only versions (pytest,
# mypy, ruff) update with the rest: CI decides.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      workspace: { patterns: ["*"] }
    commit-message: { prefix: "build(python)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }
  - package-ecosystem: docker
    directory: /docker/python
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "build(python)" }
